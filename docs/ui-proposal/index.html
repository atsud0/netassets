function nav(id,label,ico,n){return `<button class="nav ${page===id?'active':''}" onclick="go('${id}')" ${page===id?'aria-current="page"':''}>${icon(ico)}${label}${n!==undefined?`<span class="count">${n}</span>`:''}</button>`}
function heading(eyebrow,title,sub,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function metric(label,value,note,action,urgent=false){return `<button class="metric ${urgent?'urgent':''}" onclick="${action}"><span class="metric-label">${label}${icon('ArrowRight')}</span><strong>${value}</strong><small>${note}</small></button>`}
function filterGo(v){go('tasks');view=v;render()}
function render(){if(!pageNames[page])page='overview';shell();document.getElementById('main').innerHTML=({overview:overviewPage,assets:assetsPage,tasks:tasksPage,people:peoplePage,mine:minePage,plan:planPage}[page]||overviewPage)()+footer();if(page==='tasks')renderRows();if(page==='assets')renderAssets();}
function overviewPage(){return heading('WORKSPACE / OVERVIEW','今天，先处理关键事项','从待办出发，查看责任、期限与下一步。',button('查看修复任务',"onclick=\"go('tasks')\"",'primary','ArrowRight'))+`<div class="metrics">${metric('待我复测',count(t=>reviewable(t)),'逐项核验已提交的修复结果',"filterGo('review')")}${metric('已逾期',count(overdue),'需要优先跟进负责人',"filterGo('overdue')",true)}${metric('修复中',count(t=>t.status==='progress'),'其中 '+count(t=>t.returned)+' 项曾被退回',"filterGo('progress')")}${metric('待分派漏洞',assignmentCount,'来自 1 张已接收主工单',"openAssign()")}</div><div class="priority-note">${icon('Warning')}<span>供应链协同平台有 1 项严重漏洞逾期 2 天，建议优先跟进。</span>${button('查看任务',"onclick=\"openTask('RT-0247')\"",'small')}</div><div class="overview-grid"><section class="card"><div class="card-head"><div><h2>需要你处理</h2><p class="sub">根据当前角色展示操作，不混入其他人的待办。</p></div>${badge('今日优先','teal')}</div>${[['01','核验客户门户权限修复','张晨 · 云程科技 · 第 2 次提交',"openTask('RT-0248')",'开始复测'],['02','跟进逾期整改','李明 · 内部开发 · 已逾期 2 天',"openTask('RT-0247')",'查看进展'],['03','分派尚未领取的漏洞','客户门户加固 · '+assignmentCount+' 项待分派',"openAssign()",'安排人员']].map(a=>`<div class="attention-row"><span class="number">${a[0]}</span><div><p>${a[1]}</p><small>${a[2]}</small></div>${button(a[4],`onclick="${a[3]}"`,'small')}</div>`).join('')}</section><section class="card"><div class="card-head"><h2>当前任务分布</h2><span class="sub">${visibleTasks().length} 项</span></div><div class="pipeline">${[['pending','待接收'],['progress','修复中'],['org','待组织确认'],['security','待集团复测'],['done','复测通过'],['risk','接受风险']].map(([s,n])=>`<div class="pipeline-row"><span>${n}</span><div class="bar-track"><div class="bar-fill" style="width:${count(t=>t.status===s)/visibleTasks().length*100}%"></div></div><b>${count(t=>t.status===s)}</b></div>`).join('')}</div></section><section class="card"><div class="card-head"><h2>资产治理</h2>${button('查看台账',"onclick=\"go('assets')\"",'text')}</div><div class="mini-stats"><div><strong>5</strong><small>演示资产</small></div><div><strong>3</strong><small>关联业务系统</small></div><div><strong>1</strong><small>待补全系统归属</small></div></div><div class="attention-row"><div><p>历史文件服务尚未关联业务系统</p><small>补齐归属后，修复任务才能准确派发。</small></div>${button('查看资产',"onclick=\"go('assets')\"",'small')}</div></section><section class="card"><div class="card-head"><h2>最近协作动态</h2>${badge('示例记录','outline')}</div><div class="feed"><div><time>10:42</time><span>张晨提交客户门户第 2 版修复结果</span></div><div><time>09:38</time><span>林悦完成组织确认，转交集团复测</span></div><div><time>昨天</time><span>文件上传校验漏洞已复测通过</span></div></div></section></div>`}
function taskTabs(){return [['all','全部任务',visibleTasks().length],['review',role==='group'?'待我复测':'待我确认',count(reviewable)],['overdue','已逾期',count(overdue)],['returned','被退回',count(t=>t.returned&&!['done','risk'].includes(t.status))],['active','未完成',count(t=>!['done','risk'].includes(t.status))],['done','已处置',count(t=>['done','risk'].includes(t.status))]]}
function tasksPage(){return heading('SECURITY / REMEDIATION','修复任务','责任落实到人，组织确认后交集团逐项复测。',button('人员与授权',"onclick=\"go('people')\"",'', 'User')+button('派发任务',"onclick=\"openAssign()\"",'primary','Plus'))+`<div class="metrics">${metric('待分派漏洞',assignmentCount,'来自 1 张主工单',"openAssign()")}${metric(role==='group'?'待集团复测':'待组织确认',count(reviewable),'当前角色的待办队列',"setView('review')")}${metric('逾期未完成',count(overdue),'优先处理已超期任务',"setView('overdue')",true)}${metric('已复测通过',count(t=>t.status==='done'),'风险接受 '+count(t=>t.status==='risk')+' 项，单独计数',"setView('done')")}</div><section class="card queue-card"><div class="view-tabs" aria-label="任务视图">${taskTabs().map(([v,n,c])=>`<button class="view-tab ${view===v?'active':''}" onclick="setView('${v}')" aria-pressed="${view===v}">${n}<b>${c}</b></button>`).join('')}</div><div class="toolbar"><div class="search">${icon('Search')}<input id="taskSearch" aria-label="搜索修复任务" placeholder="搜索任务、系统或负责人" value="${esc(search)}" oninput="search=this.value;renderRows()"></div><select aria-label="严重程度" onchange="severity=this.value;renderRows()"><option value="">全部等级</option>${['严重','高危','中危','低危'].map(s=>`<option ${severity===s?'selected':''}>${s}</option>`).join('')}</select>${button('更多筛选',"onclick=\"toggleFilters()\"",'','Filter')}<span class="spacer"></span>${button('保存视图',"onclick=\"saveFilters()\"",'small')}${button(density?'舒适行高':'紧凑行高',"onclick=\"density=!density;renderRows();this.textContent=density?'舒适行高':'紧凑行高'\"",'small')}</div><div id="advancedFilters" class="filter-panel ${advanced?'':'hidden'}"><div class="field"><label for="filterSystem">业务系统</label><select id="filterSystem" onchange="system=this.value;renderRows()"><option value="">全部系统</option>${[...new Set(tasks.map(t=>t.system))].map(s=>`<option ${system===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="filterSort">排序方式</label><select id="filterSort" onchange="renderRows()"><option value="priority">紧急程度优先</option><option value="due">截止时间优先</option></select></div>${button('重置条件',"onclick=\"resetFilters()\"",'small')}${savedView?button('应用已保存视图',"onclick=\"applyFilters()\"",'small'):''}</div><div id="batchbar" class="batchbar hidden"></div><div id="taskTable"></div></section><p class="footnote">${icon('Lock')}任务、统计与筛选采用同一可见范围。修复通过、风险接受分别呈现。</p>`}
function setView(v){view=v;selected.clear();render()}
function filteredTasks(){return visibleTasks().filter(t=>(view==='all'||view==='active'&&!['done','risk'].includes(t.status)||view==='review'&&reviewable(t)||view==='overdue'&&overdue(t)||view==='returned'&&t.returned&&!['done','risk'].includes(t.status)||view==='done'&&['done','risk'].includes(t.status)||view==='progress'&&t.status==='progress')&&(!severity||t.severity===severity)&&(!system||t.system===system)&&(!search||`${t.id}${t.title}${t.system}${t.owner}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>document.getElementById('filterSort')?.value==='due'?a.days-b.days:Number(['done','risk'].includes(a.status))-Number(['done','risk'].includes(b.status))||Number(overdue(b))-Number(overdue(a))||Number(b.returned)-Number(a.returned)||a.days-b.days)}
function renderRows(){const rows=filteredTasks();const eligible=rows.filter(reviewable);document.getElementById('taskTable').className=density?'compact':'';document.getElementById('taskTable').innerHTML=rows.length?`<div class="table-scroll"><table class="table"><colgroup><col class="checkcol"><col style="width:30%"><col style="width:15%"><col style="width:14%"><col style="width:8%"><col style="width:12%"><col style="width:12%"><col style="width:90px"></colgroup><thead><tr><th><input type="checkbox" aria-label="选择当前可审核任务" ${eligible.length?'':'disabled'} ${eligible.length&&eligible.every(t=>selected.has(t.id))?'checked':''} onchange="selectAll(this.checked)"></th><th>任务 / 漏洞</th><th>业务系统</th><th>负责人</th><th>等级</th><th>当前状态</th><th>截止 / 优先级</th><th>下一步</th></tr></thead><tbody>${rows.map(t=>`<tr class="${selected.has(t.id)?'selected':''}"><td><input type="checkbox" aria-label="选择 ${t.id}" ${selected.has(t.id)?'checked':''} ${reviewable(t)?'':'disabled'} onchange="selectTask('${t.id}',this.checked)"></td><td class="title-cell"><button onclick="openTask('${t.id}')">${esc(t.title)}</button><div class="meta"><span>${t.id}</span>${t.returned?badge('退回修复','amber'):''}</div></td><td>${t.system}<div class="secondary">${t.org}</div></td><td><div class="owner"><span class="mini-avatar">${t.owner.slice(0,1)}</span><div>${t.owner}<div class="secondary">${t.vendor}</div></div></div></td><td>${severityTag(t)}</td><td>${statusTag(t)}</td><td><span class="due ${overdue(t)?'overdue':''}">${overdue(t)?'逾期 '+(-t.days)+' 天':t.days===0?'今天到期':t.date}</span><div class="secondary">${['done','risk'].includes(t.status)?'已完成处置':t.days===1?'剩余 1 天':t.days>1?'剩余 '+t.days+' 天':'18:00 截止'}</div></td><td>${button(reviewable(t)?role==='group'?'开始复测':'组织确认':'查看详情',`onclick="openTask('${t.id}')"`,reviewable(t)?'small':'text')}</td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>共 ${rows.length} 项 · 当前显示 ${rows.length} 项</span><div class="actions"><span>20 条 / 页</span><button class="icon-btn" disabled aria-label="上一页">${icon('ArrowLeft')}</button><span class="badge teal">1</span><button class="icon-btn" disabled aria-label="下一页">${icon('ArrowRight')}</button></div></div>`:`<div class="empty">${icon('Search')}<h3>没有符合条件的任务</h3><p>试试减少筛选条件，或查看其他状态。</p>${button('清除筛选',"onclick=\"resetFilters()\"",'primary')}</div>`;const bar=document.getElementById('batchbar');bar.classList.toggle('hidden',selected.size===0);bar.innerHTML=`<strong>已选 ${selected.size} 项</strong><span>每项单独核验、单独填写意见</span><span class="spacer"></span>${button('进入逐项审核',"onclick=\"startQueue()\"",'primary small','ArrowRight')}${button('取消选择',"onclick=\"selected.clear();renderRows()\"",'text')}`}
function selectTask(id,on){on?selected.add(id):selected.delete(id);renderRows()}
function selectAll(on){filteredTasks().filter(reviewable).forEach(t=>on?selected.add(t.id):selected.delete(t.id));renderRows()}
function toggleFilters(){advanced=!advanced;document.getElementById('advancedFilters').classList.toggle('hidden',!advanced)}
function resetFilters(){view='all';search='';severity='';system='';selected.clear();render()}
function saveFilters(){savedView={view,search,severity,system};try{localStorage.setItem('netassets-ui-demo-view',JSON.stringify(savedView))}catch{}toast('演示视图已保存在此浏览器，可在更多筛选中重新应用。');advanced=true;render()}
function applyFilters(){if(savedView){({view,search,severity,system}=savedView);render();toast('已应用保存的演示视图')}}
function startQueue(){queue=[...selected];queuePosition=0;if(queue[0])openTask(queue[0],true)}
function nextInQueue(){queuePosition++;if(queuePosition<queue.length)openTask(queue[queuePosition],true);else{document.getElementById('detail').close();queue=[];selected.clear();render();toast('本轮逐项审核已结束。')}}
function assetsPage(){return heading('ASSET GOVERNANCE / REGISTRY','网络资产','将资产值、系统归属与责任人放在同一视线内。',button('导出视图',"onclick=\"exportAssets()\"",'','Document')+button('新增资产',"onclick=\"assetForm()\"",'primary','Plus'))+`<div class="notes-banner">${icon('Connection')} 演示：5 项资产中有 1 项待补全系统归属。列表默认优先呈现识别资产所需的字段。</div><section class="card queue-card"><div class="view-tabs"><button class="view-tab active" id="allAssetsTab" onclick="assetOnlyUnlinked=false;assetTab();renderAssets()">全部资产 <b>${assets.length}</b></button><button class="view-tab" id="unlinkedTab" onclick="assetOnlyUnlinked=true;assetTab();renderAssets()">待补全系统 <b>${assets.filter(a=>a[6]==='待补全').length}</b></button></div><div class="toolbar"><div class="search">${icon('Search')}<input aria-label="搜索资产" placeholder="搜索资产名称、资产值或负责人" oninput="assetSearch=this.value;renderAssets()"></div><select aria-label="资产类型" onchange="assetType=this.value;renderAssets()"><option value="">全部类型</option><option>域名</option><option>IP 地址</option><option>URL</option></select><span class="spacer"></span><span class="sub">网络区域、导入配置等低频操作收纳到详情</span></div><div id="assetTable"></div></section>`}
let assetSearch='',assetType='',assetOnlyUnlinked=false;
function assetTab(){document.getElementById('allAssetsTab').classList.toggle('active',!assetOnlyUnlinked);document.getElementById('unlinkedTab').classList.toggle('active',assetOnlyUnlinked)}
function renderAssets(){const rows=assets.filter(a=>(!assetType||a[2]===assetType)&&(!assetOnlyUnlinked||a[6]==='待补全')&&a.join('').toLowerCase().includes(assetSearch.toLowerCase()));document.getElementById('assetTable').innerHTML=rows.length?`<div class="table-scroll"><table class="table"><thead><tr><th style="width:30%">资产 / 访问标识</th><th style="width:11%">类型</th><th style="width:24%">业务归属</th><th style="width:12%">责任人</th><th style="width:13%">信息完整性</th><th style="width:10%">操作</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="title-cell">${esc(a[0])}<div class="meta">${esc(a[1])}</div></td><td>${badge(a[2],'outline')}</td><td>${a[3]}<div class="secondary">${a[4]}</div></td><td>${a[5]}</td><td>${badge(a[6],a[6]==='待补全'?'amber':'teal')}</td><td>${button('详情',`onclick="assetDetail(${assets.indexOf(a)})"`,'text')}</td></tr>`).join('')}</tbody></table></div><div class="table-foot">共 ${rows.length} 项 · 仅展示必要列，低频字段进入详情</div>`:`<div class="empty"><h3>没有符合条件的资产</h3><p>请调整关键词或资产类型。</p></div>`}
function assetDetail(i){const a=assets[i];openForm(a[0],`<div class="content-block"><dl><dt>资产值</dt><dd>${esc(a[1])}</dd><dt>资产类型</dt><dd>${a[2]}</dd><dt>业务系统</dt><dd>${a[3]}</dd><dt>责任人</dt><dd>${a[5]}</dd><dt>所属组织</dt><dd>${a[4]}</dd></dl></div><p class="sub">低频动作集中在详情内；归档、删除在正式实现中仍需权限检查与确认。</p>`,button('关闭',"onclick=\"document.getElementById('form').close()\"",'primary'))}
function assetForm(){openForm('新增演示资产',`<div class="field"><label for="assetName">资产名称 <span class="required">*</span></label><input id="assetName" placeholder="例如：客户门户测试入口"></div><div class="field"><label for="assetValue">域名 <span class="required">*</span></label><input id="assetValue" placeholder="demo.example.test"></div><p class="sub">本次仅添加到原型内存，不会调用现有平台接口。</p>`,button('添加到演示',"onclick=\"addAsset()\"",'primary'))}
function addAsset(){const name=document.getElementById('assetName').value.trim(),value=document.getElementById('assetValue').value.trim();if(!name||!value){toast('请填写名称和域名');return}assets.unshift([name,value,'域名','未关联业务系统','华东公司','待确认','待补全']);document.getElementById('form').close();go('assets');toast('已添加演示资产。')}
function exportAssets(){download('NetAssets-演示资产.csv','\ufeff资产名称,资产值,类型,业务系统,组织,责任人\n'+assets.filter(a=>(!assetType||a[2]===assetType)&&(!assetOnlyUnlinked||a[6]==='待补全')&&a.join('').toLowerCase().includes(assetSearch.toLowerCase())).map(a=>a.slice(0,6).map(x=>'"'+x.replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
const people=[{name:'张晨',vendor:'云程科技',system:'客户服务门户',org:'华东公司',type:'外包人员',until:'2026-12-31',state:'有效',count:3},{name:'李明',vendor:'内部研发',system:'供应链协同平台',org:'华东公司',type:'内部开发',until:'2027-03-31',state:'有效',count:2},{name:'陈晓',vendor:'知行软件',system:'员工服务中心',org:'华南公司',type:'外包人员',until:'2026-10-05',state:'即将到期',count:1}];
function peoplePage(){const rows=people.filter(p=>role!=='manager'||p.org==='华东公司');return heading('COLLABORATION / PEOPLE','人员与厂商','集团维护厂商身份，组织管理员管理本组织协作授权。',button('邀请协作人员',"onclick=\"inviteForm()\"",'primary','Plus'))+`<div class="card people-summary"><span><b>${rows.length}</b> 协作人员</span><span><b>${rows.filter(p=>p.state==='即将到期').length}</b> 授权即将到期</span><span><b>${new Set(rows.filter(p=>p.type==='外包人员').map(p=>p.vendor)).size}</b> 合作厂商</span></div><section class="card queue-card"><div class="card-head"><h2>人员协作授权</h2><span class="sub">执行人员只看到分配给自己的任务</span></div><div class="table-scroll"><table class="table"><thead><tr><th style="width:20%">人员 / 身份</th><th style="width:18%">所属厂商</th><th style="width:25%">授权范围</th><th style="width:18%">授权有效期</th><th style="width:10%">进行中</th><th style="width:9%">操作</th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="owner"><span class="mini-avatar">${p.name.slice(0,1)}</span><div><strong>${p.name}</strong><div class="secondary">${p.type}</div></div></div></td><td>${p.vendor}</td><td>${p.system}<div class="secondary">${p.org}</div></td><td>${p.until}<div class="secondary">${badge(p.state,p.state==='即将到期'?'amber':p.state==='已撤销'?'red':'teal')}</div></td><td>${p.count} 项</td><td>${button('管理',`onclick="managePerson(${people.indexOf(p)})"`,'text')}</td></tr>`).join('')}</tbody></table></div></section><p class="footnote">${icon('Lock')}撤销组织授权只影响当前合作范围，不停用跨组织共用账号。</p>`}
function managePerson(i){const p=people[i];openForm('管理 '+p.name+' 的协作授权',`<div class="muted-box">${p.org} / ${p.system}<br>${p.vendor} · ${p.type}</div><div class="field" style="margin-top:18px"><label for="personDate">授权有效期</label><input id="personDate" type="date" value="${p.until}"></div><div class="field"><label for="personReason">变更原因 <span class="required">*</span></label><textarea id="personReason" placeholder="例如：项目延期至年底"></textarea></div>`,button('撤销本组织授权',`onclick="savePerson(${i},true)"`,'danger')+button('保存授权',`onclick="savePerson(${i},false)"`,'primary'))}
function savePerson(i,revoke){if(!document.getElementById('personReason').value.trim()){toast('请填写变更原因');return}people[i].until=document.getElementById('personDate').value;people[i].state=revoke?'已撤销':'有效';document.getElementById('form').close();render();toast('演示授权已更新，正式账号未发生变化。')}
function inviteForm(){openForm('邀请协作人员',`<div class="field"><label for="inviteName">人员姓名 <span class="required">*</span></label><input id="inviteName" placeholder="填写受邀人员姓名"></div><div class="field"><label for="inviteSystem">协作业务系统</label><select id="inviteSystem"><option>客户服务门户</option><option>供应链协同平台</option></select></div><div class="field"><label>合作厂商</label><select aria-label="合作厂商"><option>云程科技</option><option>知行软件</option></select></div><div class="muted-box">邀请接受并派发任务后，才开放对应的共享漏洞材料。</div>`,button('生成演示邀请',"onclick=\"if(!document.getElementById('inviteName').value.trim()){toast('请填写人员姓名');return}document.getElementById('form').close();toast('演示邀请已生成；未创建真实邀请链接。')\"",'primary'))}
function minePage(){const mine=visibleTasks().filter(t=>!['done','risk'].includes(t.status));return heading('MY WORKSPACE','我的修复任务','张晨，优先处理退回项，再安排新任务。',button('查看已完成',"onclick=\"showCompleted()\"",'','CircleCheck'))+`<div class="metrics">${metric('待我修复',count(t=>t.status==='progress'),'需要补充修复并重新提交',"document.getElementById('myTasks').scrollIntoView({behavior:'smooth'})")}${metric('待接收',count(t=>t.status==='pending'),'接收时填写预计完成时间',"openTask('RT-0243')")}${metric('等待审核',count(t=>['org','security'].includes(t.status)),'组织确认 / 集团复测',"openTask('RT-0248')")}${metric('明日到期',count(t=>t.days===1&&!['done','risk'].includes(t.status)),'期限不会因退回自动顺延',"openTask('RT-0246')",true)}</div><div class="executor-layout"><div class="task-stack" id="myTasks">${mine.sort((a,b)=>Number(b.returned)-Number(a.returned)).map(t=>`<article class="task-card ${t.returned?'returned':''}"><div class="task-card-top">${severityTag(t)}${statusTag(t)}<span class="spacer"></span><span class="sub">${t.id}</span></div><h2>${t.title}</h2><p class="sub">${t.system} · ${t.org} · 目标环境：生产</p>${t.returned?'<div class="reason"><strong>复测退回：</strong>正常下载已通过，但另一条访问路径仍未校验所属用户。请覆盖全部下载入口后重新自测。</div>':''}<div class="task-card-foot"><span class="sub">${t.date} 18:00 截止${t.days===1?' · 明日到期':''}</span>${button(t.status==='pending'?'接收任务':t.status==='progress'?'继续修复':'查看审核进度',`onclick="openTask('${t.id}')"`,t.status==='progress'?'primary':'')}</div></article>`).join('')}</div><aside><div class="card help-card"><h3>一项任务，三步交付</h3><ol><li><strong>确认修复要求</strong><br>查看批准共享的材料和目标环境。</li><li><strong>完成部署与自测</strong><br>保留版本号、结果和证明附件。</li><li><strong>提交组织确认</strong><br>组织确认后交集团复测。</li></ol><div class="muted-box" style="margin-top:16px">遇到依赖阻塞或期限冲突，可在任务中提出延期申请。</div></div><div class="card help-card" style="margin-top:16px"><h3>协作范围</h3><p class="sub">云程科技 / 华东公司<br>业务系统：客户服务门户<br>授权截止：2026年12月31日</p></div></aside></div>`}
function showCompleted(){const done=visibleTasks().filter(t=>['done','risk'].includes(t.status));openForm('我的已完成任务',done.length?done.map(t=>`<p>${t.title} · ${statuses[t.status]}</p>`).join(''):'<div class="empty"><h3>暂时没有已完成任务</h3><p>集团完成复测后，结果会出现在这里。</p></div>',button('返回任务',"onclick=\"document.getElementById('form').close()\"",'primary'))}
function openTask(id,inQueue=false){activeTask=id;if(!inQueue){queue=[];queuePosition=0}const t=tasks.find(x=>x.id===id);if(!t)return;const worker=role==='worker';const canReview=reviewable(t);const current=({pending:1,progress:2,org:3,security:4,done:5,risk:5})[t.status];const d=document.getElementById('detail');d.innerHTML=`<header class="dialog-head"><div class="actions"><strong>${worker?'处理修复任务':canReview?'逐项审核':'任务详情'}</strong>${queue.length?badge(`审核队列 ${queuePosition+1} / ${queue.length}`,'teal'):''}<span class="sub">材料、版本与意见集中在同一页</span></div><div class="actions">${queue.length?button('跳过此项',"onclick=\"nextInQueue()\"",'small'):''}<button class="icon-btn" aria-label="关闭任务详情" onclick="document.getElementById('detail').close()">${icon('Close')}</button></div></header><div class="detail-title"><div class="actions"><span class="sub">${t.id} / WO-202610-012</span>${severityTag(t)}${statusTag(t)}</div><h2>${t.title}</h2><div class="detail-meta"><span>${t.org} / ${t.system}</span><span>${t.owner} · ${t.vendor}</span><span>截止 ${t.date} 18:00</span></div><div class="stage-strip">${['待接收','修复中','组织确认','集团复测','已完成'].map((s,i)=>`<span class="stage ${i+1<current?'done':i+1===current?'current':''}"><b>${i+1<current?'✓':i+1}</b>${s}</span>`).join('')}</div></div><div class="detail-grid"><section class="evidence-pane">${t.returned?'<div class="priority-note">'+icon('Warning')+'复测退回：请覆盖备用访问路径，重新部署并补充自测证据。</div>':''}<div class="section-label"><h3>${worker?'当前共享材料':'修复材料与验收要求'}</h3><span class="version">共享版本 V${Math.max(t.version,1)}</span></div><div class="content-block"><p>相关接口需要验证请求人与目标资源的所属关系，覆盖主入口及备用访问路径。修复后应保证正常访问不受影响。</p><dl style="margin-top:13px"><dt>目标环境</dt><dd>生产环境</dd><dt>验收要求</dt><dd>验证本人访问成功、跨用户访问被拒绝，保留部署版本和自测记录。</dd></dl></div>${t.version?`<div class="section-label"><h3>第 ${t.version} 次修复提交</h3>${badge('提交时冻结','outline')}</div><div class="content-block"><dl><dt>修复说明</dt><dd>统一资源权限校验，补充入口鉴权与回归用例。</dd><dt>部署版本</dt><dd>${t.release}</dd><dt>部署环境</dt><dd>生产 · 2026-10-03 09:30</dd><dt>自测结果</dt><dd>本人请求正常，跨用户请求被拒绝；业务操作回归通过。</dd></dl></div><div class="section-label"><h3>证明附件</h3><span class="sub">2 份 · 关联本次提交</span></div><div class="content-block" style="padding-block:2px">${[['自测结果.txt','文本记录 · 2 KB'],['部署说明.txt','发布记录 · 1 KB']].map(([n,s])=>`<div class="file-item">${icon('Document')}<div>${n}<small>${s}</small></div>${button('查看',`onclick="previewProof('${n}')"`,'text')}</div>`).join('')}</div>${t.version>1?`<details open><summary>与上一次提交对比 ${icon('ArrowDown')}</summary><div class="diff-grid"><div><small>V1 · 退回前</small>只覆盖主下载入口；备用路径未校验用户。</div><div class="new"><small>V2 · 本次新增</small>统一校验所有入口，补齐跨用户访问回归证据。</div></div></details>`:''}`:'<div class="muted-box">尚未提交修复结果。接收任务后，可填写进展并上传证明。</div>'}<details style="margin-top:18px"><summary>历史操作与沟通 ${icon('ArrowDown')}</summary><div class="history">${['security','done','risk'].includes(t.status)?'<div><strong>组织确认通过</strong>材料已核对，已送集团复测</div>':''}${t.version?'<div><strong>执行人员提交修复结果</strong>'+t.owner+' · 第 '+t.version+' 次提交</div>':''}${t.status!=='pending'?'<div><strong>接收任务</strong>'+t.owner+'</div>':''}<div><strong>任务已派发</strong>组织管理员派给 ${t.owner}</div></div></details></section><aside class="decision-pane">${worker?workerPanel(t):canReview?reviewPanel(t):readPanel(t)}</aside></div>`;if(!d.open)d.showModal()}
function reviewPanel(t){return `<h3>${role==='group'?'集团复测':'组织确认'}</h3><p class="sub" style="margin-bottom:17px">审核对象：第 ${t.version} 次提交</p>${role==='group'?`<div class="field"><label for="verifyEnv">实际验证环境 <span class="required">*</span></label><select id="verifyEnv"><option>生产环境</option><option>预发布环境</option></select></div><div class="field"><label for="verifyTime">实际验证时间 <span class="required">*</span></label><input id="verifyTime" type="datetime-local" value="2026-10-03T11:00"></div>`:''}<div class="field"><label for="reviewFeedback">审核意见 <span class="required">*</span></label><textarea id="reviewFeedback" rows="4" placeholder="描述验证的版本、步骤及结果"></textarea><small>执行人员可见；请勿写入内部敏感信息。</small></div><details><summary>${icon('Lock')} 添加内部备注 ${icon('ArrowDown')}</summary><div class="field"><label for="internalFeedback">仅内部管理人员可见</label><textarea id="internalFeedback" rows="2" placeholder="内部协作信息"></textarea></div></details><div class="checklist"><label><input type="checkbox" id="confirmEvidence">我已核对目标环境、提交版本及证明材料</label></div><div class="actions">${button('退回修复',"onclick=\"reviewDecision(false)\"",'danger')}${button(role==='group'?'复测通过':'确认并送复测',"onclick=\"reviewDecision(true)\"",'primary')}</div><p class="tip">通过与退回均保留意见。每个任务独立处理，其他任务结果不受影响。</p>`}
function readPanel(t){return `<h3>当前处理进度</h3><div class="detail-callout" style="margin-top:15px">${statuses[t.status]} · ${t.status==='progress'?'等待负责人补充修复':t.status==='org'?'等待组织管理员确认':t.status==='pending'?'等待负责人接收':'处置结果已记录'}</div><div class="field"><label>负责人</label><p class="sub">${t.owner} · ${t.vendor}</p></div><div class="field"><label>下一步</label><p class="sub">${t.status==='progress'?'补齐修复结果后重新提交。':t.status==='org'?'组织确认通过后进入集团复测。':t.status==='pending'?'接收后登记预计完成时间。':'可查阅材料版本与审核历史。'}</p></div>${['pending','progress'].includes(t.status)?button('发送跟进消息',"onclick=\"followUpForm()\"",'','Bell'):''}<p class="tip">正式页面根据任务状态与当前权限展示操作，避免同时出现大量无关按钮。</p>`}
function workerPanel(t){if(t.status==='pending')return `<h3>接收并安排修复</h3><p class="sub" style="margin-bottom:18px">确认要求后，填写预计完成时间。</p><div class="field"><label for="eta">预计完成时间 <span class="required">*</span></label><input id="eta" type="datetime-local" value="2026-10-06T17:00"></div>${button('确认接收任务',"onclick=\"acceptTask()\"",'primary','Check')}<p class="tip">接收不会自动调整工单期限。</p>`;if(t.status!=='progress')return `<h3>等待审核结果</h3><div class="detail-callout" style="margin-top:15px">${statuses[t.status]}</div><p class="sub">提交版本与附件已冻结，审核结果会通过站内消息通知你。</p>`;return `<h3>提交本次修复</h3><p class="sub" style="margin-bottom:17px">先完成部署、自测，再交组织确认。</p><div class="field"><label for="repairSummary">修复说明 <span class="required">*</span></label><textarea id="repairSummary" placeholder="说明修改位置和修复方式"></textarea></div><div class="field"><label for="release">部署版本 <span class="required">*</span></label><input id="release" placeholder="例如：portal-v2.8.5"></div><div class="field"><label for="deployment">部署情况</label><select id="deployment"><option value="target">已部署到生产环境</option><option value="code">仅完成代码修改</option></select></div><div class="field"><label for="selfTest">自测结果 <span class="required">*</span></label><textarea id="selfTest" placeholder="记录正常与异常路径的验证结果"></textarea></div><div class="field"><label for="proofUpload">证明附件</label><input id="proofUpload" type="file" accept=".txt,.pdf,.png,.jpg" style="position:absolute;width:1px;height:1px;opacity:0" onchange="document.getElementById('proofName').textContent=this.files[0]?.name||'未选择文件'"><button class="btn" type="button" onclick="document.getElementById('proofUpload').click()">选择证明文件</button><small id="proofName">未选择文件</small><small>仅演示选择文件，不上传服务器。</small></div>${button('提交组织确认',"onclick=\"submitRepair()\"",'primary','ArrowRight')}<div class="actions" style="margin-top:12px">${button('申请延期',"onclick=\"extensionForm()\"",'text')}${button('记录阻塞',"onclick=\"blockerForm()\"",'text')}</div>`}
function reviewDecision(pass){if(role==='group'&&!document.getElementById('verifyTime').value){toast('请填写实际验证时间');document.getElementById('verifyTime').focus();return}const text=document.getElementById('reviewFeedback').value.trim();if(!text){toast('请填写审核意见');document.getElementById('reviewFeedback').focus();return}if(pass&&!document.getElementById('confirmEvidence').checked){toast('请先确认已核对环境、版本与证明材料');return}const t=tasks.find(t=>t.id===activeTask);if(pass){t.status=role==='group'?'done':'security';t.returned=false}else{t.status='progress';t.returned=true}t.feedback=text;selected.delete(t.id);toast(pass?'已记录本项审核结果（演示）。':'本项已退回修复（演示）。');if(queue.length)nextInQueue();else{document.getElementById('detail').close();render()}}
function acceptTask(){if(!document.getElementById('eta').value){toast('请填写预计完成时间');return}tasks.find(t=>t.id===activeTask).status='progress';openTask(activeTask);render();toast('已接收演示任务，请按计划完成修复。')}
function submitRepair(){const summary=document.getElementById('repairSummary').value.trim(),release=document.getElementById('release').value.trim(),result=document.getElementById('selfTest').value.trim();if(!summary||!release||!result){toast('请补齐修复说明、部署版本与自测结果');return}if(document.getElementById('deployment').value!=='target'){toast('此任务要求部署到生产环境，仅修改代码不能提交验收。');return}const t=tasks.find(t=>t.id===activeTask);t.status='org';t.returned=false;t.version++;t.release=release;document.getElementById('detail').close();render();toast('已提交组织确认（演示），等待组织审核。')}
function previewProof(name){openForm(name,`<div class="content-block"><h3>演示证明材料</h3><p>版本：portal-v2.8.4<br>验证环境：生产<br>正常用户访问：通过<br>跨用户资源访问：拒绝<br>备用入口权限校验：通过</p></div><p class="sub">示例文本用于展示附件查看方式，不包含真实漏洞证据。</p>`,button('下载示例',`onclick="download('${name}','NetAssets 演示材料\n正常用户访问通过；跨用户访问被拒绝。','text/plain')"`,'primary'))}
function extensionForm(){openForm('申请延期',`<div class="field"><label for="extensionReason">延期原因 <span class="required">*</span></label><textarea id="extensionReason" placeholder="说明需要延期的原因"></textarea></div><div class="field"><label for="mitigation">临时缓解措施 <span class="required">*</span></label><textarea id="mitigation" placeholder="例如：暂时限制相关入口访问"></textarea></div><div class="field"><label for="extensionDate">希望延期至</label><input id="extensionDate" type="date" value="2026-10-08"></div><p class="sub">批准前沿用原期限，超过主工单期限需集团审批。</p>`,button('提交延期申请',"onclick=\"if(!document.getElementById('extensionReason').value.trim()||!document.getElementById('mitigation').value.trim()){toast('请填写延期原因和临时缓解措施');return}document.getElementById('form').close();toast('演示延期申请已提交，原期限保持不变。')\"",'primary'))}
function blockerForm(){openForm('记录修复阻塞',`<div class="field"><label for="blocker">阻塞原因</label><textarea id="blocker" placeholder="说明当前依赖与影响"></textarea></div><div class="field"><label for="dependency">依赖方</label><input id="dependency" placeholder="例如：运维发布组"></div><div class="field"><label for="unblock">预计解除时间</label><input id="unblock" type="datetime-local" value="2026-10-04T10:00"></div>`,button('保存阻塞记录',"onclick=\"if(!document.getElementById('blocker').value.trim()||!document.getElementById('dependency').value.trim()){toast('请填写阻塞原因与依赖方');return}document.getElementById('form').close();toast('演示阻塞已记录，任务期限不自动暂停。')\"",'primary'))}
function followUpForm(){openForm('发送跟进消息',`<div class="field"><label for="followup">给当前负责人的消息</label><textarea id="followup" placeholder="请同步当前进展及预计完成时间"></textarea></div>`,button('发送演示消息',"onclick=\"if(!document.getElementById('followup').value.trim()){toast('请输入消息');return}document.getElementById('form').close();toast('跟进消息已在演示中记录，未发送到真实人员。')\"",'primary'))}
let assignmentCount=3;
function openAssign(){openForm('派发修复任务',`<div class="muted-box">主工单：客户门户专项加固<br>${assignmentCount} 项尚未分派漏洞 · 截止 2026年10月10日</div><div class="field" style="margin-top:17px"><label for="assignOwner">具体负责人 <span class="required">*</span></label><select id="assignOwner"><option value="">选择已有系统授权的人员</option><option>张晨 · 云程科技 · 客户服务门户</option></select><small>仅展示覆盖所选业务系统的有效授权。</small></div><div class="field"><label for="assignDue">任务截止时间</label><input id="assignDue" type="date" value="2026-10-09"></div><div class="field"><label for="assignMaterial">共享材料预览</label><textarea id="assignMaterial">请按照公开复现步骤完善接口权限验证，部署生产后提交版本号与自测结果。</textarea></div><label class="sub"><input id="sharedConfirm" type="checkbox"> 我已检查共享材料，不包含内部敏感信息</label>`,button('确认派发',"onclick=\"assignDemo()\"",'primary'))}
function assignDemo(){if(!document.getElementById('assignOwner').value||!document.getElementById('sharedConfirm').checked){toast('请选择具体负责人，并确认共享材料。');return}if(!assignmentCount){toast('演示待分派任务已全部派发');return}for(let i=0;i<assignmentCount;i++)tasks.push({id:'RT-025'+i,title:['个人资料接口需补充权限控制','后台导出入口需核对访问范围','历史查询接口需增加身份校验'][i],system:'客户服务门户',org:'华东公司',owner:'张晨',vendor:'云程科技',severity:'中危',status:'pending',date:'10月09日',days:6,returned:false,version:0,release:''});assignmentCount=0;document.getElementById('form').close();go('tasks');toast('已派发 3 项演示任务，可切换开发人员查看。')}
function showNotifications(){openForm('消息中心',`<div class="attention-row" style="padding:12px 0"><div><h3>修复结果待复测</h3><p class="sub">客户门户已提交第 2 版修复结果。</p></div>${button('查看',"onclick=\"document.getElementById('form').close();role='group';go('tasks');openTask('RT-0248')\"",'small')}</div><div class="attention-row" style="padding:12px 0"><div><h3>有任务即将到期</h3><p class="sub">文件下载接口任务明日到期，请及时处理。</p></div></div><p class="sub">以上为固定演示消息，正式实现应按当前授权及任务状态生成。</p>`,button('关闭',"onclick=\"document.getElementById('form').close()\"",'primary'))}
function openForm(title,body,actions){const d=document.getElementById('form');d.innerHTML=`<header class="dialog-head"><strong>${title}</strong><button class="icon-btn" aria-label="关闭弹窗" onclick="document.getElementById('form').close()">${icon('Close')}</button></header><div class="form-body">${body}</div><footer class="form-foot">${actions}</footer>`;if(!d.open)d.showModal()}
function toast(text){const e=document.getElementById('toast');e.textContent=text;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),4200)}
function download(name,text,type){const link=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type}));link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function planPage(){return heading('DESIGN PROPOSAL / 01','NetAssets 界面优化方案','全平台统一风格，重点打通漏洞修复协作。',button('打印 / 保存 PDF',"onclick=\"window.print()\"",'','Document')+button('体验交互原型',"onclick=\"go('tasks')\"",'primary','ArrowRight'))+`<div class="plan-grid"><section class="card plan-card wide"><span class="badge teal">推荐方向 · 延续品牌，重排工作顺序</span><p class="tagline" style="margin:16px 0 8px">先看到该处理什么，再看到完成它所需的信息。</p><p>保留 NetAssets 的深蓝导航、青绿色品牌和管理系统的表格习惯。统一页面壳层、状态语言与操作位置，将首屏空间还给实际任务。风险接受、误报与修复通过仍分别计数，UI 调整不改变权限和审批规则。</p><div class="step-diagram"><div><b>01 找到待办</b><small>首页优先事项 / 常用视图</small></div><div class="highlight"><b>02 查看同一上下文</b><small>任务、当前提交、材料版本</small></div><div class="highlight"><b>03 完成当前动作</b><small>接收 / 提交 / 组织确认 / 复测</small></div><div><b>04 获得明确反馈</b><small>结果、去向与下一项任务</small></div></div></section>
<section class="card plan-card wide"><h2>一、现状与优先级</h2><p>本次在 1440 × 1000 视口采集了当前应用。首页、资产台账、工单、修复列表、人员页来自现有 8080；详情与审核记录来自同版本的独立恢复环境。未向现有应用写入测试业务数据。</p><div class="table-scroll"><table class="plan-table"><thead><tr><th style="width:8%">优先级</th><th style="width:28%">观察到的问题</th><th>建议</th><th style="width:22%">收益 / 验收目标</th></tr></thead><tbody><tr><td>P0</td><td>修复列表顶部堆叠筛选、统计及说明，列表表头在截图约 y=660 才出现。</td><td>使用 4 个紧凑指标、常用任务视图、单行搜索和折叠高级筛选。已选任务后再显示批量操作条。</td><td>1440×900 默认列表首屏目标至少显示 5 行任务。</td></tr><tr><td>P0</td><td>资产操作列较宽，主数据字段被挤压；每行常驻历史、编辑、归档、删除。</td><td>合并“名称+资产值”“系统+组织”；列表保留详情入口，低频和破坏性操作收纳到详情。</td><td>默认列不出现信息被操作栏盖住的情况；表格内部保留横向滚动。</td></tr><tr><td>P0</td><td>任务详情有 7 个页签，审核依据与动作分散。</td><td>独立审核布局：左侧材料、当前提交、证据和版本差异；右侧意见、实际验证信息及操作。</td><td>不切换页签即可核对当前提交并完成审核。</td></tr><tr><td>P0</td><td>平台自定义青绿/深蓝与组件默认亮蓝混用，辅助字灰度较浅。</td><td>将 Element Plus 主题变量映射至统一设计变量，统一按钮、链接、标签、焦点和文本对比度。</td><td>关键文字满足既定对比度目标；状态同时用文字表达。</td></tr><tr><td>P1</td><td>首页业务总量在上，逾期和复测待办靠下；左侧多个分组默认展开。</td><td>按角色优先展示待办；当前分组展开，其余分组可收起并记忆。</td><td>首屏回答“我现在该处理哪件事”。</td></tr><tr><td>P1</td><td>空列表仅提示没有数据，缺少从零开通、授权、接收与派单的引导。</td><td>区分“尚未开通”“暂无任务”“筛选无结果”“权限失效”和“加载失败”，给对应下一步。</td><td>空状态有原因、有可执行入口，不把接口失败显示成空列表。</td></tr><tr><td>P1</td><td>人员页同屏混合账号、授权、合作厂商、集团规则等层级。</td><td>以协作授权为日常主视图，集团档案与规则进入管理入口；把到期和失效状态前置。</td><td>组织管理员能辨认“撤销本组织授权”和“停用全局账号”的区别。</td></tr></tbody></table></div></section>
<section class="card plan-card"><h2>二、全平台视觉规范</h2><ul><li>导航 216–232 px、顶栏 64 px、页面边距 24–32 px；常规内容以 8 px 为间距基准。</li><li>主标题 24–26 px、区块标题 16 px、正文 14 px、表格 12–14 px；中文长标题最多两行。</li><li>卡片圆角 8–10 px，以轻边框区分层级；减少大块空白、嵌套卡片和重复说明。</li><li>主操作统一青绿；蓝色表示处理中；橙色表示期限/退回；红色表示严重风险或失败。</li><li>统一 36 px 常规控件，移动端触控目标至少 40–44 px；键盘焦点必须可见。</li><li>日期对齐：列表突出“今天到期 / 逾期 2 天”，详情保留完整时间及统一时区。</li></ul><div class="colors"><div class="swatch" style="background:#102a43" title="导航 #102A43"></div><div class="swatch" style="background:#147d72" title="主操作 #147D72"></div><div class="swatch" style="background:#276392" title="进行中 #276392"></div><div class="swatch" style="background:#996018" title="提醒 #996018"></div><div class="swatch" style="background:#b5343b" title="风险 #B5343B"></div></div></section>
<section class="card plan-card"><h2>三、统一组件，不逐页打补丁</h2><ul><li><strong>PageHeader：</strong>固定标题、范围说明和一个主要操作，其余放次级菜单。</li><li><strong>ListToolbar：</strong>常用视图、搜索、高级筛选、重置及保存视图。</li><li><strong>StatusBadge：</strong>任务状态、严重程度、逾期标记分开表达，禁止“完成=全部修复”。</li><li><strong>DataTable：</strong>统一密度、空态、错误态、列宽与选中批量操作。</li><li><strong>TaskContext：</strong>任务编号、负责人、系统、期限和流程阶段统一展示。</li><li><strong>ReviewPanel：</strong>绑定当前提交的审核信息，公共反馈与内部备注分区。</li></ul><p style="margin-top:14px">沿用 Vue 3 + Element Plus。通过主题变量和共享布局逐步替换，无需引入另一套组件库。</p></section>
<section class="card plan-card wide"><h2>四、关键页面布局</h2><div class="step-diagram"><div><b>管理端任务列表</b><small>标题 + 主操作<br>关键待办指标<br>常用视图 + 搜索<br>密集可读的任务表格</small></div><div class="highlight"><b>审核工作区</b><small>固定任务上下文<br>左侧：材料 + 证据 + 差异<br>右侧：意见 + 核验 + 动作<br>队列可跳过，不能一键全通过</small></div><div><b>执行人员工作台</b><small>只看本人任务<br>退回原因直接露出<br>根据状态给一个主要动作<br>提交表单分阶段展示</small></div><div><b>资产与人员台账</b><small>名称与身份优先<br>归属与状态明确<br>低频字段移入详情<br>高风险动作二次确认</small></div></div><p>原型保留的是优化方向和关键交互。正式实施时完整保留原有安全测试、填报、审计、备份、主工单关闭等入口；演示导航仅包含本次展示的六个页面，不表示删除其他模块。</p></section>
<section class="card plan-card wide"><h2>五、实施拆分与接口边界</h2><div class="table-scroll"><table class="plan-table"><thead><tr><th>阶段</th><th>具体工作</th><th>接口影响</th><th>验收</th></tr></thead><tbody><tr><td>1 · 统一基础</td><td>主题变量、导航、标题、按钮/标签、列表工具栏、空态及错误态。</td><td>主要为前端调整；保留原权限判断与路由。</td><td>抽查首页、资产、工单、人员四类页面；键盘与窄屏检查。</td></tr><tr><td>2 · 修复业务</td><td>任务常用视图、列表密度、审核双栏、版本差异、开发人员任务卡和提交路径。</td><td>复用已有任务/统计/材料/提交/审核接口；保存修复筛选视图需要扩展现有 page_key。</td><td>管理员派单→本人提交→组织确认→集团复测；退回及材料待复核不能绕过。</td></tr><tr><td>3 · 全平台推广</td><td>资产、业务系统、主工单、填报、测试、审计等列表统一；首页待办聚合。</td><td>首页跨模块待办、精确汇总和已保存视图可能需小幅后端补充；不使用客户端全量取数。</td><td>权限回归、分页/筛选回归、列表性能与数据一致性检查。</td></tr></tbody></table></div><p style="margin-top:14px">工作量粗估：基础 2–3 人日，修复关键流程 3–5 人日，其他页面推广与回归 3–5 人日。为方案级估算，需在确定页面范围和组件复用情况后细化，不包含新业务能力开发。</p></section>
<section class="card plan-card wide"><h2>六、状态与无障碍验收</h2><ul><li>除了正常数据，应覆盖初次使用、筛选无结果、加载、请求失败、授权过期、版本冲突和提交成功。</li><li>审核按钮与当前提交绑定，版本过时先刷新；材料待复核时阻止通过，不依靠按钮颜色表示限制。</li><li>正文与背景对比度目标至少 4.5:1；图标与控件边界目标至少 3:1。需在正式主题落地后对所有状态测量。</li><li>表单有可访问名称，必填项同时用文字/标记，出错聚焦到具体字段；弹窗支持 Escape 和焦点返回。</li><li>桌面重点验证 1440/1280，窄屏验证 768/390；表格在容器内滚动，任务详情在小屏改为单列。</li></ul><p style="margin-top:12px">截图可以支持布局、层级和可见文案判断，不能证明屏幕阅读器兼容、全部焦点顺序或完整无障碍达标。本次将单独检查原型交互和响应式行为。</p></section>
<section class="card plan-card wide"><h2>七、现状截图与观察记录</h2><p>以下均为本轮新采集的截图。业务数据不上传外部设计平台。各图展示一个固定视口，长页面下方内容未全部展开。</p></section>
${[
['01-dashboard','01 · 集团首页','基础布局完整，但治理总量与填报大卡片优先，安全复测和逾期指标落在首屏底部。改进：角色待办上移、风险直接可操作。'],
['02-assets','02 · 资产台账','查询与保存视图齐全。主要问题是操作栏占据固定宽度，挤压负责人等字段；主文字与辅助文字差别较弱。改进：双行组合信息、减少常驻操作。'],
['03-work-orders','03 · 安全工单','状态、个人整改进度和操作能够看见；顶部标题说明、提醒、页签、筛选及保存视图层次较多。改进：收拢低频说明，统一常用视图与动作层级。'],
['04-remediation','04 · 修复任务列表','功能入口完整；当前是无任务状态，仍展示全套统计及批量审核栏。改进：首次使用提供开通→授权→接收→派发引导，无筛选结果时提供重置。'],
['05-task-detail','05 · 任务详情','已经明确显示退回原因和授权失效，值得保留。顶部信息和操作较多，下方七个页签增加查找成本。改进：将异常原因与其解决动作相邻放置。'],
['07-review','06 · 提交与审核记录','历史提交、环境、自测、附件和审核记录可追溯。当前截图是已退回的历史场景，没有正在处理的审核表单。双栏审核方案结合截图和当前组件代码提出。'],
['06-people','07 · 人员与厂商','账号与授权入口集中，角色分工已有基础；空态仍使用 No Data、Total 英文默认文案。改进：统一中文文案并给出开通协作引导。']
].map(([f,title,note])=>`<section class="card plan-card"><h2>${title}</h2><p>${note}</p><a href="current/${f}.png" target="_blank" rel="noopener"><img src="current/${f}.png" alt="${title}当前界面截图" loading="lazy"></a><p>限制：截图未验证所有状态、读屏表现及完整键盘操作。</p></section>`).join('')}
<section class="card plan-card"><h2>交互演示说明</h2><ol><li>打开“修复任务”，切换常用视图、搜索、筛选并保存视图。</li><li>切换“开发人员”，打开退回任务，补齐修复信息并提交。</li><li>切换“组织管理员”，对刚提交的任务组织确认。</li><li>切换“集团安全人员”，查看材料与版本，完成复测。</li><li>勾选待审核任务，体验逐项审核队列。</li></ol><p style="margin-top:14px">所有业务操作仅修改当前页面的演示内存，刷新可重置；仅已保存筛选视图使用浏览器本地存储。该原型没有接入真实后端，也不作为权限边界实现。</p></section></div>`}
