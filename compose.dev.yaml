# Isolated development database and toolchains. No production data volumes.
# Usage: podman compose -p netassets-dev -f compose.dev.yaml run --rm backend
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: netassets_dev_test
      POSTGRES_USER: netassets_dev_test
      POSTGRES_PASSWORD: local-development-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netassets_dev_test -d netassets_dev_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    image: docker.io/library/golang:1.26-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace:Z
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://host.containers.internal:6152}
      HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://host.containers.internal:6152}
      NO_PROXY: localhost,127.0.0.1,postgres
      DATABASE_URL: postgres://netassets_dev_test:local-development-test-only@postgres:5432/netassets_dev_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "go run ./cmd/migrate up && go test ./... && NETASSETS_TEST_DATABASE_URL=$$DATABASE_URL go test -p 1 -count=1 ./..."]
  web:
    image: docker.io/library/node:22-alpine
    working_dir: /workspace
    volumes:
      - ./web:/workspace:Z
      - web-modules:/workspace/node_modules
    environment:
      HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://host.containers.internal:6152}
      HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://host.containers.internal:6152}
    command: ["sh", "-c", "npm ci && npm test -- --run && npm run build"]
volumes:
  go-mod:
  go-build:
  web-modules:
